    if(me && me.role === 'hunter' && !me.alive && me.hunterCanShoot && !me.skillUsedThisRound){
      html += `
        <div class="skill-panel" style="background:linear-gradient(180deg,#2a1508 0%,#1a0d05 100%);border-color:rgba(230,126,34,.5)">
          <h3 style="color:#e67e22">🏹 猎人开枪</h3>
          <div class="skill-desc">你已被淘汰，可以开枪带走一名玩家</div>
          <button class="btn-skill hunter" id="btnHunterShoot">💥 选择开枪目标</button>
        </div>
      `;
    }

    // 女巫/其他技能 - 投票阶段锁定
    if(myRoleDef && myRoleDef.skill && me.alive && me.role !== 'hunter'){
      html += renderSkillPanel(me, myRoleDef, r, 'voting');
    }

    if(me && !me.alive && me.role !== 'hunter'){
      html += `
        <div class="result-panel" style="padding:16px;border-color:#c0392b">
          <div style="font-size:14px;color:#e74c3c;letter-spacing:2px">☠️ 你已出局</div>
          <div style="font-size:12px;color:#888;margin-top:6px">你可以旁观或退出房间</div>
        </div>
      `;
    }

    if(isHost){
      html += renderHostPhaseControls(r.phase);
      html += renderSkillLog();
    }

    if(me && me.alive){
      if(!myVote){
        html += `<button class="btn btn-danger" id="btnVote" style="padding:20px;font-size:18px">🗳 点击投票</button>`;
      } else {
        const t = r.players[myVote];
        html += `
          <div class="vote-panel">
            <h3>✅ 你已投票</h3>
            <div style="font-size:14px;color:#ccc">投票对象：${t ? esc(t.name) : '未知'}</div>
          </div>
        `;
      }
    }

    html += `<div class="vote-progress"><span class="status-dot"></span>已投票：${voteCount}/${aliveVoteCount} 人</div>`;

    if(r.voteRevealed){
      const counts = {};
      Object.keys(r.votes || {}).forEach(voterId => {
        const tid = r.votes[voterId];
        counts[tid] = (counts[tid] || 0) + 1;
      });
      const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
      html += `<div class="card"><h2>📊 投票结果</h2>`;
      if(sorted.length === 0){
        html += `<div style="color:#666;text-align:center;padding:10px">暂无投票</div>`;
      } else {
        sorted.forEach(tid => {
          const tp = r.players[tid];
          if(tp){
            html += `<div class="vote-result-row"><span>${esc(tp.name)}</span><span class="vr-count">${counts[tid]} 票</span></div>`;
          }
        });
      }
      html += `</div>`;
    }

    html += renderPlayerGrid(players, true);
    html += `<button class="btn btn-outline" id="btnLeave">退出房间</button>`;
  }

  /* ============ 结束阶段 ============ */
  else if(r.phase === 'ended'){
    html += `
      <div class="result-panel">
        <div class="result-title">本 轮 结 束</div>
        <div class="result-detail">
          <p>第 ${r.round || 1} 轮游戏已结束</p>
          <p style="margin-top:8px">主持人可点击"🌙 天黑请闭眼"开始下一轮，或"🔄 重新开始"重置游戏</p>
        </div>
      </div>
    `;

    if(isHost){
      html += renderHostPhaseControls(r.phase);
      html += renderSkillLog();
    }

    html += `<div class="card"><h2>身份公布</h2><div class="player-grid">`;
    players.forEach(p => {
      const rd = ROLE_DEFS[p.role] || ROLE_DEFS.villager;
      const cls = 'player-card' + (p.alive ? '' : ' dead');
      html += `
        <div class="${cls}">
          <div class="p-avatar">${rd.icon}</div>
          <div class="p-name">${esc(p.name)}</div>
          <div class="p-role ${rd.group}">${rd.name}</div>
          ${!p.alive ? '<div class="dead-badge">☠️ 出局</div>' : ''}
        </div>
      `;
    });
    html += `</div></div>`;
    html += `<button class="btn btn-outline" id="btnLeave">退出房间</button>`;
  }

  html += '<div class="safe-bottom"></div>';
  app.innerHTML = html;
  bindRoomEvents();

  updateRolePickerReveal();

  if(r.phase === 'selecting' && me && !me.role && !isHost && !rolePickerOpen){
    setTimeout(() => showRolePicker(), 150);
  }
}

/* 技能面板渲染 */
function renderSkillPanel(me, myRoleDef, r, phase){
  const isNight = phase === 'night';

  // ============ 女巫 ============
  if(me.role === 'witch'){
    if(me.witchAntidoteUsed && me.witchPoisonUsed){
      return `
        <div class="skill-panel ${isNight ? 'night' : 'day'}">
          <h3>🧪 女巫 · 药水已用完</h3>
          <div class="skill-desc">${isNight ? '两瓶药水都已使用过' : '☀️ 白天不能使用技能'}</div>
          <button class="btn-skill used" disabled>✓ 药水已用完</button>
        </div>
      `;
    }
    const antidoteUsed = me.witchAntidoteUsed;
    const poisonUsed = me.witchPoisonUsed;

    return `
      <div class="skill-panel ${isNight ? 'night' : 'day'}">
        <h3>🧪 女巫 · 用药（第 ${r.round} 轮）</h3>
        <div class="skill-desc">${isNight ? '选择使用解药或毒药（每种仅一次）' : '☀️ 白天不能使用技能，等待天黑'}</div>
        <button class="btn-skill antidote ${!isNight || antidoteUsed ? 'used' : ''}" id="btnUseAntidote"
                ${!isNight || antidoteUsed ? 'disabled' : ''}>
          🧪 解药 ${antidoteUsed ? '（已使用）' : '（救人）'}
        </button>
        <button class="btn-skill poison ${!isNight || poisonUsed ? 'used' : ''}" id="btnUsePoison"
                ${!isNight || poisonUsed ? 'disabled' : ''}>
          ☠️ 毒药 ${poisonUsed ? '（已使用）' : '（毒人）'}
        </button>
      </div>
    `;
  }

  // ============ 猎人 ============
  if(me.role === 'hunter'){
    // 猎人技能不由阶段控制，而是由主持人点击出局触发
    // 在别处渲染
    return '';
  }

  // ============ 通用（狼人/预言家/守卫/丘比特）============
  if(!myRoleDef.skill) return '';

  const used = me.skillUsedThisRound;
  const skillClass = myRoleDef.skill.style || (isNight ? 'night' : '');
  const usage = (r.skillUsages || []).filter(u => u.playerId === myId && u.round === r.round).pop();

  // 守卫特殊提示
  let extraDesc = '';
  if(me.role === 'guard' && me.lastGuardedId && me.lastGuardedRound === r.round - 1){
    const lastTarget = r.players[me.lastGuardedId];
    if(lastTarget) extraDesc = `<div style="color:#f39c12;font-size:11px;margin-top:6px">⚠️ 上一轮已守护「${esc(lastTarget.name)}」，本轮不能再守护同一人</div>`;
  }

  return `
    <div class="skill-panel ${isNight ? 'night' : 'day'}">
      <h3>${myRoleDef.skill.icon} 技能 · ${myRoleDef.skill.name}（第 ${r.round} 轮）</h3>
      <div class="skill-desc">
        ${isNight ? myRoleDef.skill.desc : '☀️ 白天不能使用技能，等待天黑'}
        ${extraDesc}
      </div>
      <button class="btn-skill ${!isNight || used ? 'used' : skillClass}" id="btnUseSkill"
              ${!isNight || used ? 'disabled' : ''}>
        ${!isNight ? '☀️ 白天无法使用' : (used ? '✓ 本轮技能已使用' : myRoleDef.skill.icon + ' 使用技能')}
      </button>
      ${usage ? `
        <div class="skill-usage-info">
          <b>第 ${r.round} 轮使用记录：</b>${fmtTime(usage.timestamp)} 对 <b>${esc(usage.targetNames.join('、'))}</b> 使用了「${esc(usage.skillName)}」
          ${usage.revealResult ? `<br><b style="color:#ff6b6b">查验结果：</b>${usage.revealResult.map(t => esc(t.name) + ' → ' + esc(t.roleName)).join('，')}` : ''}
        </div>
      ` : ''}
    </div>
  `;
}

function renderRoleShowcase(){
  return `
    <div class="console">
      <h3>🎛 身份牌一览</h3>
      <div class="console-hint">点击任意身份牌查看详细介绍 · 技能在"天黑请闭眼"时自动开启</div>
      <div class="role-console">
        ${Object.keys(ROLE_DEFS).filter(k => k !== 'villager').map(rk => {
          const rd = ROLE_DEFS[rk];
          return `
            <div class="role-console-card" data-info="${rk}">
              <div class="rc-icon">${rd.icon}</div>
              <div class="rc-name">${rd.name}</div>
              <div class="rc-skill">${rd.skill ? rd.skill.icon + ' ' + rd.skill.name : '无技能'}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="role-console" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
        <div class="role-console-card" data-info="villager">
          <div class="rc-icon">👤</div>
          <div class="rc-name">平民</div>
          <div class="rc-skill">无技能</div>
        </div>
      </div>
    </div>
  `;
}

function renderHostPhaseControls(currentPhase){
  const r = room;
  const isNight = currentPhase === 'night';
  const isDay = currentPhase === 'day';
  const isVoting = currentPhase === 'voting';
  const isEnded = currentPhase === 'ended';
  return `
    <div class="console">
      <h3>🌗 阶段控制</h3>
      <div class="console-hint">
        🌙 天黑 → 技能自动全开 &nbsp;·&nbsp; ☀️ 天亮 → 技能自动全关
      </div>
      <div class="phase-controls">
        <button class="btn btn-night ${isNight ? 'active' : ''}" id="btnStartNight">
          🌙 天黑请闭眼
        </button>
        <button class="btn btn-day ${isDay ? 'active' : ''}" id="btnStartDay">
          ☀️ 天亮请睁眼
        </button>
        <button class="btn btn-danger ${isVoting ? 'active' : ''}" id="btnStartVoting">
          🗳 开始投票
        </button>
        <button class="btn btn-outline" id="btnEndRound">
          🏁 结束本轮
        </button>
      </div>
      ${isVoting ? `
        <button class="btn btn-gold btn-sm" id="btnRevealVotes" style="width:100%;margin-top:10px">
          📊 ${r.voteRevealed ? '已公布结果' : '公布投票结果'}
        </button>
      ` : ''}
      ${isEnded ? `
        <button class="btn btn-gold btn-sm" id="btnRestart" style="width:100%;margin-top:10px">
          🔄 重新开始新游戏
        </button>
      ` : ''}
      <div style="text-align:center;color:#666;font-size:11px;margin-top:12px;line-height:1.6">
        💡 点击"天黑请闭眼"进入新一轮并自动开启所有技能
      </div>
    </div>
  `;
}

function renderSkillLog(){
  const r = room;
  const usages = (r.skillUsages || []).slice().sort((a,b) => b.timestamp - a.timestamp);
  return `
    <div class="console">
      <h3>📜 技能使用日志</h3>
      <div class="console-hint">所有玩家技能使用详情（含预言家查验结果）</div>
      <div class="skill-log">
        ${usages.length === 0 ? `<div class="skill-log-empty">暂无技能使用记录</div>` : usages.map(u => {
          const rd = ROLE_DEFS[u.role];
          return `
            <div class="skill-log-item">
              <div class="sl-head">
                <span style="color:#fff">${esc(u.playerName)}</span>
                <span class="sl-role">${rd ? rd.icon : ''} ${esc(u.roleName)}</span>
                <span style="color:#888;font-size:11px">第 ${u.round || 1} 轮</span>
                <span class="sl-time">${fmtTime(u.timestamp)}</span>
              </div>
              <div>使用了 <b style="color:#bb8fce">${u.skillIcon} ${esc(u.skillName)}</b> → 目标：<span class="sl-target">${esc(u.targetNames.join('、'))}</span></div>
              ${u.revealResult ? `
                <div class="sl-result">
                  🔍 查验结果：${u.revealResult.map(t => `<b>${esc(t.name)}</b> 是 <b>${esc(t.roleName)}</b>`).join('，')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderPlayerGrid(players, showSkill){
  let html = '<div class="card"><h2>场上玩家</h2><div class="player-grid">';
  if(players.length === 0){
    html += `<div style="grid-column:1/-1;text-align:center;color:#666;padding:16px;font-size:13px">暂无玩家</div>`;
  }
  players.forEach(p => {
    const isMe = p.id === myId;
    const rd = p.role ? ROLE_DEFS[p.role] : null;
    const visible = isMe || isHost;
    const cls = 'player-card' + (p.alive ? '' : ' dead') + (isMe ? ' me' : '') + (isHost ? ' tappable' : '');
    let badge = '';
    if(showSkill && isHost && p.role && ROLE_DEFS[p.role] && ROLE_DEFS[p.role].skill){
      if(p.role === 'witch'){
        const a = p.witchAntidoteUsed ? '解✓' : '解';
        const b = p.witchPoisonUsed ? '毒✓' : '毒';
        badge = `<div class="skill-used-badge">${a} ${b}</div>`;
      } else if(p.role === 'hunter'){
        if(p.hunterCanShoot) badge = `<div class="skill-used-badge" style="background:rgba(230,126,34,.3);color:#e67e22">可开枪</div>`;
        else if(p.skillUsedThisRound) badge = `<div class="skill-used-badge">已开枪</div>`;
      } else if(p.skillUsedThisRound){
        badge = `<div class="skill-used-badge">技能已用</div>`;
      }
    }
    html += `
      <div class="${cls}" ${isHost ? `data-playerid="${esc(p.id)}"` : ''}>
        ${badge}
        <div class="p-avatar">${p.alive ? '👤' : '💀'}</div>
        <div class="p-name">${esc(p.name)}${isMe ? '(你)' : ''}</div>
        <div class="p-role ${visible && rd ? rd.group : ''}">
          ${visible && rd ? rd.icon + ' ' + rd.name : (p.role ? '已抽身份' : '未抽')}
        </div>
        ${!p.alive ? '<div class="dead-badge">☠️ 出局</div>' : ''}
      </div>
    `;
  });
  html += '</div></div>';
  return html;
}

/* ============ 事件绑定 ============ */
function bindRoomEvents(){
  const r = room;

  // 玩家卡片点击
  document.querySelectorAll('.player-card.tappable').forEach(el => {
    el.addEventListener('click', () => {
      const pid = el.getAttribute('data-playerid');
      if(pid) onPlayerCardClick(pid);
    });
  });

  // 查看身份详情
  document.querySelectorAll('[data-info]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showRoleDetail(el.getAttribute('data-info'));
    });
  });

  // 我的身份卡
  const myRoleCard = document.getElementById('myRoleDisplay');
  if(myRoleCard && r.players[myId] && r.players[myId].role){
    myRoleCard.addEventListener('click', () => showRoleDetail(r.players[myId].role));
  }

  // 通用技能按钮
  const btnUseSkill = document.getElementById('btnUseSkill');
  if(btnUseSkill && !btnUseSkill.disabled){
    btnUseSkill.addEventListener('click', () => openSkillTargetModal());
  }

  // 女巫技能按钮
  const btnUseAntidote = document.getElementById('btnUseAntidote');
  if(btnUseAntidote && !btnUseAntidote.disabled){
    btnUseAntidote.addEventListener('click', () => openSkillTargetModal('antidote', true));
  }
  const btnUsePoison = document.getElementById('btnUsePoison');
  if(btnUsePoison && !btnUsePoison.disabled){
    btnUsePoison.addEventListener('click', () => openSkillTargetModal('poison', true));
  }

  // 猎人开枪按钮
  const btnHunterShoot = document.getElementById('btnHunterShoot');
  if(btnHunterShoot){
    btnHunterShoot.addEventListener('click', () => openSkillTargetModal('default', false));
  }

  // 等待阶段：人数
  const sel = document.getElementById('maxPlayers');
  if(sel) sel.addEventListener('change', e => hostSetMaxPlayers(e.target.value));
  const wolfSel = document.getElementById('wolfCount');
  if(wolfSel) wolfSel.addEventListener('change', e => hostSetWolfCount(e.target.value));

  // 身份启用/禁用
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      hostToggleRole(el.getAttribute('data-toggle'));
    });
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showRoleDetail(el.getAttribute('data-toggle'));
    });
  });

  // 阶段按钮
  const btnStart = document.getElementById('btnStartGame');
  if(btnStart) btnStart.addEventListener('click', hostStartGame);
  const btnStartNight = document.getElementById('btnStartNight');
  if(btnStartNight) btnStartNight.addEventListener('click', hostStartNight);
  const btnStartDay = document.getElementById('btnStartDay');
  if(btnStartDay) btnStartDay.addEventListener('click', hostStartDay);
  const btnSV = document.getElementById('btnStartVoting');
  if(btnSV) btnSV.addEventListener('click', hostStartVoting);
  const btnER = document.getElementById('btnEndRound');
  if(btnER) btnER.addEventListener('click', hostEndRound);
  const btnRV = document.getElementById('btnRevealVotes');
  if(btnRV) btnRV.addEventListener('click', hostRevealVotes);
  const btnRS = document.getElementById('btnRestart');
  if(btnRS) btnRS.addEventListener('click', hostRestart);
  const btnVote = document.getElementById('btnVote');
  if(btnVote) btnVote.addEventListener('click', openVoteModal);
  const btnLeave = document.getElementById('btnLeave');
  if(btnLeave) btnLeave.addEventListener('click', leaveRoom);

  // 分享按钮
  const btnCopyCode = document.getElementById('btnCopyCode');
  if(btnCopyCode) btnCopyCode.addEventListener('click', () => copyText(r.code, '房间码已复制'));
  const roomCodeDisplay = document.getElementById('roomCodeDisplay');
  if(roomCodeDisplay) roomCodeDisplay.addEventListener('click', () => copyText(r.code, '房间码已复制'));
  const btnCopyLink = document.getElementById('btnCopyLink');
  if(btnCopyLink) btnCopyLink.addEventListener('click', () => {
    const url = location.origin + location.pathname + '?room=' + r.code;
    copyText(url, '游戏链接已复制');
  });
  const btnShare = document.getElementById('btnShare');
  if(btnShare) btnShare.addEventListener('click', shareGameLink);

  // 二维码
  if(r.phase === 'waiting' && isHost){
    setTimeout(() => {
      const el = document.getElementById('qrcode');
      if(!el) return;
      el.innerHTML = '';
      try{
        if(typeof QRCode !== 'undefined'){
          const url = location.origin + location.pathname + '?room=' + r.code;
          new QRCode(el, {
            text: url, width: 180, height: 180,
            colorDark: '#000000', colorLight: '#ffffff',
            correctLevel: (QRCode.CorrectLevel && QRCode.CorrectLevel.H) || 2
          });
        } else {
          el.innerHTML = '<div style="color:#666;font-size:12px;padding:10px">二维码组件未加载</div>';
        }
      }catch(e){
        el.innerHTML = '<div style="color:#666;font-size:12px;padding:10px">二维码生成失败</div>';
      }
    }, 60);
  }
}

/* ============ 主渲染 ============ */
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  updateBodyTheme();
  if(screen === 'home') renderHome(app);
  else if(screen === 'room') renderRoom(app);
}

/* ============ 初始化 ============ */
window.addEventListener('DOMContentLoaded', () => {
  if(typeof Peer === 'undefined'){
    setTimeout(() => {
      if(typeof Peer === 'undefined') toast('网络组件加载失败，请刷新页面', 5000);
    }, 2000);
  }
  window.addEventListener('beforeunload', () => {
    if(isHost) saveHostRoom();
    if(peer){ try{ peer.destroy(); }catch(e){} }
  });
  render();
});

window.showRoleDetail = showRoleDetail;
window.leaveRoom = leaveRoom;
</script>
</body>
</html>
